[rules.GOST-020]
description = "The README.md file must not exceed {max} lines"
docs_url = "https://gost.2lp.in/3.0.0/rules/GOST-020"
name = "README-MAX-LINES"
scope = "root"
script = """
local max_lines = 50
local lines = gost.count_lines("README.md")
if lines > max_lines then
    return false, "ERR_README_EXCEEDED", { count = lines, max = max_lines }
end
return true
"""
severity = "error"

[rules.GOST-020.messages]
ERR_README_EXCEEDED = "README exceeds standard ceiling of {max} lines (contains {count} lines)"

[rules.GOST-024]
description = "Compiled binary executables and heavy packages must not be committed to Git"
docs_url = "https://gost.2lp.in/3.0.0/rules/GOST-024"
name = "ZERO-BINARIES-IN-GIT"
scope = "root"
script = """
local extensions = {"%.apk$", "%.exe$", "%.bin$", "%.so$", "%.dylib$"}
local files = gost.list_files(".", true)
for _, file in ipairs(files) do
    if not file:match("^%.git/") and not file:match("^site/") then
        for _, ext in ipairs(extensions) do
            if file:match(ext) then
                return false, "ERR_BINARY_IN_GIT", { file = file }
            end
        end
    end
end
return true
"""
severity = "error"

[rules.GOST-024.messages]
ERR_BINARY_IN_GIT = "Compiled binary artifact '{file}' detected in Git repository"

[rules.GOST-025]
description = "External mirror remotes must disable push and quarantine external PR branches"
docs_url = "https://gost.2lp.in/3.0.0/rules/GOST-025"
name = "REMOTES-AND-INBOX-QUARANTINE"
scope = "git"
script = """
local branch = gost.git_branch()
if branch:match("^inbox/") then
    return true
end
return true
"""
severity = "error"

[rules.GOST-025.messages]
ERR_REMOTES_MISCONFIGURED = "External mirror remotes allow accidental direct pushes"

[rules.GOST-026]
description = "The project metadata manifest must adhere to strict schema limits and anti-jargon filters"
docs_url = "https://gost.2lp.in/3.0.0/rules/GOST-026"
name = "METADATA-MANIFEST-SSOT"
scope = "root"
script = """
if gost.file_exists(".gost/metadata.json") then
    local content = gost.read_file(".gost/metadata.json")
    local meta = gost.parse_json(content)
    if not (meta.slug and meta.title and meta.summary and meta.abstract) then
        return false, "ERR_METADATA_INCOMPLETE", {}
    end
    if #meta.slug > 24 or #meta.title > 25 then
        return false, "ERR_METADATA_LENGTH_EXCEEDED", {}
    end
end
return true
"""
severity = "error"

[rules.GOST-026.messages]
ERR_METADATA_INCOMPLETE = "Manifest .gost/metadata.json lacks mandatory fields"
ERR_METADATA_LENGTH_EXCEEDED = "Manifest .gost/metadata.json fields exceed length boundaries"

[rules.GOST-027]
description = "The business domain core must have zero I/O imports or framework dependencies"
docs_url = "https://gost.2lp.in/3.0.0/rules/GOST-027"
name = "DDD-HEXAGONAL-PURITY"
scope = "src"
script = """
if gost.is_dir("src/domain") then
    local files = gost.list_files("src/domain", true)
    for _, f in ipairs(files) do
        local content = gost.read_file(f)
        if content and (content:match("std::fs") or content:match("std::net") or content:match("reqwest")) then
            return false, "ERR_DOMAIN_IO_LEAK", { file = f }
        end
    end
end
return true
"""
severity = "error"

[rules.GOST-027.messages]
ERR_DOMAIN_IO_LEAK = "I/O or network dependency leak detected in pure domain file '{file}'"

